  }
  if(P.hp<D.lh-.5)msg('⚠ По тебе стреляют! Нажми «Вернуться»');
  D.lh=P.hp;
  const dd=Math.hypot(p.x-P.x,p.z-P.z);
  let why=null;
  if(p.y<.4)why='Дрон разбился о землю';
  else if(Math.abs(p.x)>820||Math.abs(p.z)>820)why='Дрон вышел за карту';
  else if(boxes.some(b=>p.y<b.h&&p.x>b.x0&&p.x<b.x1&&p.z>b.z0&&p.z<b.z1))why='Дрон врезался в стену';
  else if(D.gr<=0&&trees.some(t=>p.y<t.h&&Math.hypot(p.x-t.x,p.z-t.z)<(p.y<t.h*.6?1.6:t.r*.7)))why='Дрон врезался в дерево';
  else if(dd>260)why='Связь потеряна';
  else if(D.bat<=0)why='Батарея села';
  if(why){recLost(why);return}
  if(dd>210&&!D.w1){D.w1=1;msg('⚠ Слабый сигнал, лети ближе')}if(dd<190)D.w1=0;

  $('hc').textContent='🔋 '+Math.max(0,Math.ceil(D.bat))+' с · до тебя '+Math.round(dd)+' м';
  $('hs').textContent=Math.round(p.y)+' м · '+Math.round(v*3.6)+' км/ч · газ '+Math.round(th*100)+'%';
}
